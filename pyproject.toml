[project]
name = "ai-stock-agent"
version = "0.1.0"
description = "LangGraph ReAct agent for stock analysis on AWS Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain-aws",
    "langchain-community",
    "langgraph-checkpoint-aws",
    "faiss-cpu",
    "yfinance",
    "fastapi",
    "uvicorn[standard]",
    "langfuse",
    "pydantic-settings",
    "pypdf",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "httpx-sse",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_stock_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests requiring a running server",
    "llm: LLM evaluation tests requiring model access",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
